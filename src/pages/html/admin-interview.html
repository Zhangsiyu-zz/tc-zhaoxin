<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面试结果 - TC实验室</title>
    <link rel="stylesheet" href="../../css/admin-interview.css">
</head>

<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <h2>TC 管理后台</h2>
            <ul class="sidebar-menu">
                <li onclick="window.location.href='admin-dashboard.html'">学生管理</li>
                <li onclick="window.location.href='admin-applicants.html'">报名管理</li>
                <li class="active">面试结果</li>
                <li>修改密码</li>
                <li>退出登录</li>
            </ul>
        </aside>

        <main class="admin-main">
            <div class="admin-header">
                <h3>学生面试结果</h3>
                <div class="user-info">管理员：张三 | 退出</div>
            </div>

            <div class="content">
                <div class="card">
                    <div class="filter-bar">
                        <select>
                            <option value="">面试时间（全部）</option>
                            <option value="week1">第一周</option>
                            <option value="week2">第二周</option>
                        </select>
                        <select>
                            <option value="">意向方向（全部）</option>
                            <option value="embedded">嵌入式</option>
                            <option value="fullstack">全栈</option>
                            <option value="android">安卓</option>
                        </select>
                        <button>查看结果</button>
                    </div>
                </div>

                <div class="card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>学生学号</th>
                                <th>学生姓名</th>
                                <th>意向方向</th>
                                <th>面试时间</th>
                                <th>面试结果状态</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>20240001</td>
                                <td>张三</td>
                                <td>前端</td>
                                <td>2026-09-05</td>
                                <td><span class="status-tag status-pass">通过</span></td>
                            </tr>
                            <tr>
                                <td>20240002</td>
                                <td>李四</td>
                                <td>安卓</td>
                                <td>2026-09-06</td>
                                <td><span class="status-tag status-pending">待定</span></td>
                            </tr>
                            <tr>
                                <td>20240003</td>
                                <td>王五</td>
                                <td>嵌入式</td>
                                <td>2026-09-07</td>
                                <td><span class="status-tag status-fail">未通过</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
