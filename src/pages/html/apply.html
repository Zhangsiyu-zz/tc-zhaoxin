<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报名 · TC实验室招新</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/apply.css">
</head>
<body>
    <header class="site-header">
        <nav class="nav">
            <a class="logo" href="index.html">
                <span class="logo-mark">TC</span>
                <span>TC 实验室</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="index.html#directions">四大方向</a></li>
                <li><a class="is-active" href="apply.html">报名</a></li>
                <li><a href="result.html">面试结果</a></li>
            </ul>
            <div class="nav-actions">
                <a class="btn btn-ghost" href="login.html">登录</a>
                <a class="btn btn-primary" href="apply.html">立即报名</a>
            </div>
        </nav>
    </header>

    <main class="auth-shell">
        <section class="auth-card wide">
            <div class="auth-kicker">APPLICATION</div>
            <h1>选择方向并报名</h1>
            <p class="lead">请选择一个主攻方向。提交后可在「面试结果」页查看进度。</p>
            <form class="form-grid" method="post" action="">
                <div class="field">
                    <label>意向方向</label>
                    <div class="dir-pick">
                        <label class="dir-option">
                            <input type="radio" name="direction" value="embedded">
                            <b>嵌入式</b>
                            <span>硬件、固件与实时系统</span>
                        </label>
                        <label class="dir-option">
                            <input type="radio" name="direction" value="frontend">
                            <b>前端</b>
                            <span>界面、交互与工程化</span>
                        </label>
                        <label class="dir-option">
                            <input type="radio" name="direction" value="backend">
                            <b>后端</b>
                            <span>接口、数据与服务架构</span>
                        </label>
                        <label class="dir-option">
                            <input type="radio" name="direction" value="android">
                            <b>安卓</b>
                            <span>移动应用与产品实现</span>
                        </label>
                    </div>
                </div>
                <div class="field">
                    <label for="intro">自我介绍</label>
                    <textarea id="intro" name="intro" placeholder="技术基础、做过的项目、为什么想加入 TC 实验室"></textarea>
                </div>
                <div class="field">
                    <label for="experience">相关经历（选填）</label>
                    <textarea id="experience" name="experience" placeholder="竞赛、课程设计或个人作品"></textarea>
                </div>
                <button class="btn btn-accent btn-block btn-lg" type="submit">提交报名</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <span class="footer-brand">TC 实验室</span>
            <span>学生端报名</span>
        </div>
    </footer>
</body>
</html>
