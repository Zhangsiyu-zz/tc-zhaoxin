<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 · TC实验室招新</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/password.css">
</head>
<body>
    <header class="site-header">
        <nav class="nav">
            <a class="logo" href="index.html">
                <span class="logo-mark">TC</span>
                <span>TC 实验室</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="index.html#directions">四大方向</a></li>
                <li><a href="apply.html">报名</a></li>
                <li><a href="result.html">面试结果</a></li>
            </ul>
            <div class="nav-actions">
                <a class="btn btn-ghost" href="login.html">登录</a>
                <a class="btn btn-primary" href="apply.html">立即报名</a>
            </div>
        </nav>
    </header>

    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-kicker">RESET PASSWORD</div>
            <h1>修改密码</h1>
            <p class="lead">通过注册邮箱收取验证码后，设置新的登录密码。</p>
            <form class="form-grid" method="post" action="">
                <div class="field">
                    <label for="email">邮箱</label>
                    <input id="email" name="email" type="email" placeholder="请输入注册时填写的邮箱">
                </div>
                <div class="field">
                    <label for="emailCode">邮箱验证码</label>
                    <div class="inline-row">
                        <input id="emailCode" name="emailCode" type="text" placeholder="请输入邮箱验证码" autocomplete="off">
                        <button class="btn btn-ghost btn-send" type="button">发送验证码</button>
                    </div>
                    <span class="field-hint">验证码发送与校验逻辑请自行接入。</span>
                </div>
                <div class="field">
                    <label for="newPassword">新密码</label>
                    <input id="newPassword" name="newPassword" type="password" placeholder="请输入新密码">
                </div>
                <div class="field">
                    <label for="newPasswordConfirm">确认新密码</label>
                    <input id="newPasswordConfirm" name="newPasswordConfirm" type="password" placeholder="再次输入新密码">
                </div>
                <button class="btn btn-primary btn-block btn-lg" type="submit">确认修改</button>
            </form>
            <p class="auth-foot"><a href="login.html">返回登录</a></p>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <span class="footer-brand">TC 实验室</span>
            <span>学生端 · 修改密码</span>
        </div>
    </footer>
</body>
</html>
