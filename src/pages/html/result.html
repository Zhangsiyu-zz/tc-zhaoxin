<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面试结果 · TC实验室招新</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/result.css">
</head>
<body>
    <header class="site-header">
        <nav class="nav">
            <a class="logo" href="index.html">
                <span class="logo-mark">TC</span>
                <span>TC 实验室</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="index.html#directions">四大方向</a></li>
                <li><a href="apply.html">报名</a></li>
                <li><a class="is-active" href="result.html">面试结果</a></li>
            </ul>
            <div class="nav-actions">
                <a class="btn btn-ghost" href="login.html">登录</a>
                <a class="btn btn-primary" href="apply.html">立即报名</a>
            </div>
        </nav>
    </header>

    <main class="page-main">
        <section class="result-layout">
            <div class="result-hero">
                <div>
                    <div class="kicker">INTERVIEW RESULT</div>
                    <h1>个人面试结果</h1>
                    <p>登录后将在此查看你的报名方向、面试安排与最终结果。以下为页面结构示意。</p>
                </div>
                <span class="status">面试通过</span>
            </div>

            <div class="meta-grid">
                <div class="meta-card">
                    <span>姓名 / 学号</span>
                    <strong>张同学 · 20240001</strong>
                </div>
                <div class="meta-card">
                    <span>报名方向</span>
                    <strong>前端</strong>
                </div>
                <div class="meta-card">
                    <span>面试时间</span>
                    <strong>待面试通知</strong>
                </div>
            </div>

            <div class="panel panel-progress">
                <span class="label">进度</span>
                <div class="timeline">
                    <div class="step done">
                        <i></i>
                        <div>
                            <strong>已提交报名</strong>
                            <p>材料已进入审核队列。</p>
                        </div>
                    </div>
                    <div class="step done">
                        <i></i>
                        <div>
                            <strong>完成面试</strong>
                            <p>方向面试与综合沟通已完成。</p>
                        </div>
                    </div>
                    <div class="step">
                        <i></i>
                        <div>
                            <strong>结果公布</strong>
                            <p>恭喜通过前端方向面试，请关注后续入组安排。</p>
                        </div>
                    </div>
                </div>
                <div class="comment">
                    评语示意：表达清晰，对项目落地有自己的理解，建议入组后尽快参与一个前端迭代任务。
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <span class="footer-brand">TC 实验室</span>
            <span>学生端 · 面试结果</span>
        </div>
    </footer>
</body>
</html>
